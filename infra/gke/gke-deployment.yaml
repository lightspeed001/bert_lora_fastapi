apiVersion: apps/v1
kind: Deployment
metadata:
  name: lora-bert-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: lora-bert
  template:
    metadata:
      labels:
        app: lora-bert
    spec:
      containers:
      - name: lora-bert
        image: gcr.io/YOUR_PROJECT_ID/lora-bert-fastapi:latest  # Replace with your GCR image
        ports:
        - containerPort: 8000
        resources:
          limits:
            cpu: "2"
            memory: "4Gi"
            nvidia.com/gpu: 1  # If using GPU
          requests:
            cpu: "1"
            memory: "2Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: lora-bert-service
spec:
  selector:
    app: lora-bert
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: LoadBalancer

